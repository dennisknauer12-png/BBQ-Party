<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fff8f1">
  <title>Danke für deine Rückmeldung</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100svh;
      display:grid;
      place-items:center;
      padding:24px;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:#2d3934;
      background:radial-gradient(circle at 20% 10%,#ffd6c4,transparent 30%),linear-gradient(160deg,#fff8f1,#e8f3eb)
    }
    main{
      width:min(100%,580px);
      padding:38px 28px;
      text-align:center;
      background:rgba(255,255,255,.92);
      border-radius:28px;
      box-shadow:0 20px 55px rgba(80,67,52,.14)
    }
    .icon{font-size:3rem}
    h1{font-size:clamp(2.2rem,10vw,4rem);line-height:.95;margin:18px 0}
    p{color:#66736c;line-height:1.65}
    .event-card{
      margin:24px 0 4px;
      padding:18px;
      border:1px solid rgba(65,86,75,.12);
      border-radius:20px;
      background:#fffdf9;
      text-align:left
    }
    .event-card strong{display:block;margin-bottom:6px}
    .event-card span{display:block;color:#66736c;line-height:1.5}
    .actions{display:grid;gap:12px;margin-top:22px}
    a{
      display:block;
      padding:14px 18px;
      border-radius:999px;
      text-decoration:none;
      font-weight:850
    }
    .calendar{background:#3f6b57;color:white}
    .back{background:#f1e4da;color:#5e4a3d}
  </style>
</head>
<body>
  <main>
    <div class="icon">🌅</div>
    <h1>Danke für deine Rückmeldung!</h1>
    <p>Deine Zu- oder Absage wurde versendet. Wir freuen uns auf einen richtig schönen Spätsommerabend.</p>

    <div class="event-card">
      <strong>End of Summer Barbecue</strong>
      <span>Samstag, 26. September 2026 · 16:00 Uhr</span>
      <span>Pomonaring 43, 22926 Ahrensburg</span>
    </div>

    <div class="actions">
      <a class="calendar" href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=End+of+Summer+Barbecue+bei+uns&dates=20260926T133000Z%2F20260926T203000Z&details=End+of+Summer+Barbecue+bei+Dennis.+Terrasse%2C+Grill%2C+kalte+Drinks+und+ein+sch%C3%B6ner+Sp%C3%A4tsommerabend.&location=Pomonaring+43%2C+22926+Ahrensburg&ctz=Europe%2FBerlin" target="_blank" rel="noopener noreferrer">In Google Kalender eintragen</a>
      <a class="back" href="./">Zurück zur Einladung</a>
    </div>
  </main>
</body>
</html>
